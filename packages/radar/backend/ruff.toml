# Project-specific settings, kept outside the kj-managed block above so that
# `kj harden` can regenerate it without losing them.

[lint.flake8-bugbear]
# FastAPI's dependency injection *is* a function call in a default argument
# (`db: AsyncSession = Depends(get_db)`), so B008 fires on every route and
# every dependency. These calls are evaluated by FastAPI, not at import time.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[lint.per-file-ignores]
# Migrations are historical records: they are not rewritten to satisfy style
# rules, because a merged migration must keep producing the same schema.
"alembic/versions/*" = ["E501"]
