sonar.projectKey=karajan-radar
sonar.projectName=Karajan Radar
sonar.projectVersion=0.1.0

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src

# The frontend keeps its tests next to the code they cover, so the same
# directory is listed as both source and test root. This inclusion is what
# tells the two apart; without it the scanner treats specs as production code.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/migrations/**
sonar.sourceEncoding=UTF-8
