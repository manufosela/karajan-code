# Workflow REUSABLE de ingesta por merge (F1).
#
# Lo invoca el repo de despliegue de la organización (privado) en cada
# merge de un repo observado. Monta el workspace multi-repo COMPLETO
# (obligatorio: el manifest incremental invalida los ficheros ausentes,
# indexar un workspace parcial destruiría el corpus de los demás repos),
# restaura el manifest y reindexa incrementalmente con karajan-rag.
#
# Genérico: nada de organizaciones concretas — todo llega por inputs,
# secrets y el karajan-watch.config.json del repo que llama.
name: kjw-ingest
on:
  workflow_call:
    inputs:
      org:
        description: Organización de GitHub dueña de los repos observados
        type: string
        required: true
      config-path:
        description: Ruta del karajan-watch.config.json en el repo que llama
        type: string
        default: karajan-watch.config.json
      corpus:
        description: Corpus a reindexar (code | docs)
        type: string
        default: code
      workspace-dir:
        description: Directorio del workspace multi-repo
        type: string
        default: .kjw-workspace
      karajan-watch-version:
        description: Versión de karajan-watch a ejecutar
        type: string
        default: latest
    secrets:
      REPOS_TOKEN:
        description: Token con lectura de todos los repos observados
        required: true
      PG_URL:
        description: Conexión pgvector del corpus (si el store es pgvector)
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Un reindex a la vez por corpus: dos merges concurrentes compartiendo
    # el manifest cacheado se pisarían. Se serializa, nunca se cancela
    # (cancelar un reindex es perder frescura del corpus).
    concurrency:
      group: kjw-ingest-${{ inputs.corpus }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Montar workspace multi-repo (todos los repos declarados)
        env:
          REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
          ORG: ${{ inputs.org }}
          CONFIG: ${{ inputs.config-path }}
          WS: ${{ inputs.workspace-dir }}
        run: |
          set -euo pipefail
          # Auth por header (patrón actions/checkout): el token no entra en
          # la URL remota, ni en .git/config, ni en mensajes de error.
          AUTH=$(printf 'x-access-token:%s' "$REPOS_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          mkdir -p "$WS"
          jq -c '.repos[]' "$CONFIG" | while read -r repo; do
            name=$(jq -r '.name' <<<"$repo")
            branch=$(jq -r '.branch // "main"' <<<"$repo")
            echo "clonando $ORG/$name@$branch"
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
              clone --quiet --depth 1 --branch "$branch" \
              "https://github.com/${ORG}/${name}.git" "$WS/$name"
          done

      # Manifest incremental: si el cache no aparece, el reindex es
      # completo — correcto aunque lento, nunca un índice a medias.
      - name: Restaurar manifest incremental
        uses: actions/cache@v4
        with:
          path: ${{ inputs.workspace-dir }}/.karajan
          key: kjw-manifest-${{ inputs.corpus }}-${{ github.run_id }}
          restore-keys: |
            kjw-manifest-${{ inputs.corpus }}-

      # El backend del store es un peer que el motor no arrastra: sin él la
      # ingesta muere pidiéndolo. Se instala LOCAL junto a karajan-watch —no
      # con npx efímero— para que la resolución del módulo lo encuentre.
      - name: Instalar karajan-watch y el backend del store
        env:
          CONFIG: ${{ inputs.config-path }}
          CORPUS: ${{ inputs.corpus }}
          KJW_VERSION: ${{ inputs.karajan-watch-version }}
        run: |
          set -euo pipefail
          store=$(jq -r --arg c "$CORPUS" '.corpus[$c].store' "$CONFIG")
          case "$store" in
            lancedb) peer='@lancedb/lancedb' ;;
            pgvector) peer='pg' ;;
            in-memory) peer='' ;;
            *) echo "store no soportado en $CONFIG: $store"; exit 1 ;;
          esac
          echo "store declarado: $store${peer:+ (backend $peer)}"
          npm install --no-save --silent "karajan-watch@${KJW_VERSION}" ${peer:+"$peer"}

      - name: Reindexar corpus (karajan-rag, embedder local en el runner)
        env:
          PG_URL: ${{ secrets.PG_URL }}
          # KJW-BUG-0008: los inputs viajan por env y se usan como variables de shell. Interpolar
          # ${{ inputs.* }} dentro de `run` los sustituye ANTES de que el shell vea la linea, asi
          # que quien invoca este workflow reusable podria ejecutar lo que quisiera — con PG_URL
          # en el entorno de este mismo paso. El paso anterior ya lo hacia bien.
          CONFIG: ${{ inputs.config-path }}
          WS: ${{ inputs.workspace-dir }}
          CORPUS: ${{ inputs.corpus }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/karajan-watch ingest \
            --config "$CONFIG" \
            --workspace "$WS" \
            --corpus "$CORPUS"
