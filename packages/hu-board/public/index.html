<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karajan HU Board</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%237c3aed'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-family='sans-serif' font-weight='bold'>K</text></svg>">
</head>
<body>
  <header class="header">
    <div class="header__logo">
      <svg viewBox="0 0 32 32" width="32" height="32">
        <rect width="32" height="32" rx="6" fill="#7c3aed"/>
        <text x="16" y="22" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif" font-weight="bold">K</text>
      </svg>
      <div>
        <div class="header__title">Karajan HU Board</div>
        <div class="header__subtitle">story management dashboard</div>
      </div>
    </div>
    <nav class="header__nav">
      <button class="nav-btn active" data-view="board" title="Kanban board: every HU of the selected project, grouped by status (Pending → Certified → Done). Click an HU card to expand the detail panel.">Board</button>
      <button class="nav-btn" data-view="graph" title="Dependency graph of the selected project's HUs — who blocks whom. Useful before scheduling work.">Graph</button>
      <button class="nav-btn" data-view="dashboard" title="Per-project landing: stats grid + project list. Click a project card to focus the kanban / graph on that project.">Dashboard</button>
      <button class="nav-btn" data-view="sessions" title="Every kj run that has touched the board, newest first. Filter by project; click a session to inspect its iterations, commits and checkpoints.">Sessions</button>
      <button class="nav-btn" data-view="governance" title="The acta: policy rules by friction, the hash-chained decision log and its anchor, standing exceptions with owner and expiry, renewals and signals.">Governance</button>
      <a class="nav-btn" href="/pipeline.html" title="Live observability of pipeline runs (Karajan v2.7+): stage timings, agent calls, decision logs.">Pipeline</a>
      <a class="nav-btn" href="/rag.html" title="RAG retrieval-quality dashboard: chunk counts, embedder provider, db size.">RAG</a>
      <a class="nav-btn" href="/wiki.html" title="Search the per-project QMD semantic wiki (docs, plans, reviews).">Wiki</a>
      <select class="project-select" id="project-select">
        <option value="">All Projects</option>
      </select>
      <div class="header__controls">
        <button class="control-btn" id="help-btn" title="What does each view do? Quick reference for Board / Graph / Dashboard / Sessions / Pipeline.">?</button>
        <button class="control-btn" id="config-btn" title="Configurar Karajan (modelos, agentes, tope de iteraciones, …)">⚙</button>
        <button class="control-btn" id="commands-btn" title="Launch a Karajan CLI command (kj plan, kj architect, kj clean…)">⚡</button>
        <button class="control-btn" id="conversation-btn" title="Conversación con tu agente — la terminal real, dentro del board (ADR 0008)" onclick="openConversationPanel()">💬</button>
        <button class="control-btn" id="restart-btn" title="Restart the HU Board server (preserves URL, the page reconnects automatically)">🔁</button>
        <button class="control-btn" id="sync-btn" title="Re-scan disk for new batches">🔄</button>
        <button class="control-btn" id="force-refresh-btn" title="Force a clean reload — wipes browser caches and reloads. Use when the UI looks stale and a normal refresh isn't fixing it." onclick="window.forceRefresh()">🧹</button>
      </div>
    </nav>
  </header>

  <main class="main" id="app">
    <div class="loading">
      <div class="loading__spinner"></div>
      <p>Loading...</p>
    </div>
  </main>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" id="modal-content"></div>
  </div>

  <script src="/utils/maggle-mode.js"></script>
  <script src="/utils/formatters.js"></script>
  <script src="/utils/modals.js"></script>
  <script src="/utils/api.js"></script>
  <script src="/utils/sessions-view.js"></script>
  <script src="/utils/board-view.js"></script>
  <script src="/utils/dashboard-view.js"></script>
  <script src="/utils/graph-view.js"></script>
  <script src="/utils/governance-view.js"></script>
  <script src="/utils/project-picker-view.js"></script>
  <script src="/utils/story-detail-view.js"></script>
  <script src="/utils/preflight-view.js"></script>
  <script src="/utils/plan-rollup-view.js"></script>
  <script src="/utils/log-panel.js"></script>
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/utils/terminal-panel.js"></script>
  <script src="/utils/hu-actions.js"></script>
  <script src="/utils/project-actions.js"></script>
  <script src="/utils/story-edit-form.js"></script>
  <script src="/utils/config-editor.js"></script>
  <script src="/utils/command-launcher.js"></script>
  <script src="/utils/run-launcher.js"></script>
  <script src="/utils/server-push.js"></script>
  <script src="/app.js"></script>
  <script src="/utils/init-listeners.js"></script>
</body>
</html>
