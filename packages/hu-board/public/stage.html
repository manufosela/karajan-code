<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kj stage · Karajan HU Board</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #05080d; color: #e2e8f0; font: 14px/1.5 Inter, system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    header { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 16px; align-items: center; padding: 12px 20px; }
    header a { color: #8cb4c9; }
    #stage-status { position: fixed; left: 20px; bottom: 16px; margin: 0; padding: 0; list-style: none; color: #9ca6ae; }
    #stage-status li { margin: 2px 0; }
    /* KJC-TSK-1608: each line in the tone of what it says; the newest in Matrix green, bold. */
    #stage-status .stage-tone-live { color: #e2e8f0; }
    #stage-status .stage-tone-pass { color: #7ed69a; }
    #stage-status .stage-tone-refuse { color: #ff7b7b; }
    #stage-status .stage-tone-wait { color: #f0b429; }
    #stage-status .stage-tone-info { color: #9ca6ae; }
    #stage-status .stage-newest { color: #00ff41; font-weight: 700; text-shadow: 0 0 6px rgb(0 255 65 / 0.45); }
    /* KJC-TSK-1466: on the map the list only speaks to screen readers; one line per factory covered the scene. */
    #stage-status.stage-unseen { clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; white-space: nowrap; }
    #stage-loading { position: fixed; inset: 0; display: flex; gap: 12px; align-items: center; justify-content: center; color: #9ca6ae; pointer-events: none; }
    #stage-loading[hidden] { display: none; }
    #stage-loading::before { content: ''; width: 18px; height: 18px; border: 2px solid #2a3a4e; border-top-color: #8cb4c9; border-radius: 50%; animation: stage-spin 0.8s linear infinite; }
    @keyframes stage-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #stage-loading::before { animation: none; } }
    .stage-cue { color: #e2e8f0; }
    .stage-worker { position: fixed; transform: translate(-50%, -100%); padding: 1px 8px; border-radius: 8px; background: #1a2332; border: 1px solid #2a3a4e; font-size: 12px; color: #e2e8f0; pointer-events: none; }
    /* KJC-TSK-1607: a host that waits: amber for the person, blue for a process. */
    .stage-worker.stage-wait-person { background: #f0b429; border-color: #f0b429; color: #10161f; font-weight: 700; }
    .stage-worker.stage-wait-process { background: #1d4f7a; border-color: #3d86bd; color: #e2e8f0; }
    .stage-count { position: fixed; transform: translate(-50%, -100%); font-weight: 700; color: #f0b429; pointer-events: none; }
    /* KJC-TSK-1585: one filled colour per kind of answer, white text that reads on each. */
    .stage-mark { position: fixed; transform: translate(-50%, -100%); padding: 1px 8px; border-radius: 8px; color: #fff; border: 1px solid rgb(255 255 255 / 0.25); font-size: 12px; font-weight: 600; pointer-events: none; white-space: nowrap; }
    .stage-mark-approve { background: #1d7f45; }
    .stage-mark-refuse { background: #b8282f; }
    .stage-mark-stop { background: #6d35b5; }
    .stage-mark-exempt { background: #9a5b0c; }
    .stage-mark-unsure { background: #545e6e; }
    /* KJC-TSK-1588: the sign over a desk whose card waits with no agent, one colour per lane state. */
    .stage-desk { position: fixed; transform: translate(-50%, -100%); padding: 1px 8px; border-radius: 6px; color: #fff; border: 1px solid rgb(255 255 255 / 0.25); font-size: 12px; font-weight: 600; pointer-events: none; white-space: nowrap; }
    .stage-desk-merge { background: #9a5b0c; }
    .stage-desk-failed { background: #b8282f; }
    .stage-desk-stopped { background: #545e6e; }
    .stage-desk-person { background: #7a5d00; }
    .stage-desk-done { background: #1d7f45; }
    /* KJC-TSK-1590: the projects panel at the left; folded behind its button on a narrow screen. */
    #stage-projects { position: fixed; z-index: 2; top: 56px; left: 0; bottom: 0; width: 260px; overflow-y: auto; padding: 8px; box-sizing: border-box; background: rgb(14 21 32 / 0.88); border-right: 1px solid #2a3a4e; }
    #stage-projects p { margin: 8px; color: #9ca6ae; }
    #stage-projects ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
    #stage-projects a { display: grid; padding: 8px 10px; border-radius: 8px; color: #e2e8f0; text-decoration: none; }
    #stage-projects a:hover { background: #1a2332; }
    #stage-projects a:focus-visible { outline: 2px solid #f0b429; }
    #stage-projects a[aria-current="page"] { background: #24364d; outline: 1px solid #8cb4c9; }
    /* KJC-TSK-1605: larger type, to read the factories well; and the badge of one that needs the human. */
    #stage-projects strong { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #stage-projects small { font-size: 14px; color: #b4bec7; }
    #stage-projects .stage-attention { display: inline-block; min-width: 1.4em; padding: 0 6px; border-radius: 999px; background: #f0b429; color: #10161f; font-size: 13px; font-weight: 700; text-align: center; }
    #stage-projects-toggle { display: none; }
    @media (min-width: 721px) { #stage-status { left: 280px; } }
    @media (max-width: 720px) {
      #stage-projects { display: none; width: min(280px, calc(100vw - 32px)); }
      #stage-projects.stage-projects-open { display: block; }
      #stage-projects-toggle { display: inline-block; }
    }
    /* KJC-TSK-1570: the avatar panel. */
    header button { font: inherit; color: #e2e8f0; background: #1a2332; border: 1px solid #2a3a4e; border-radius: 8px; padding: 4px 12px; cursor: pointer; }
    /* KJC-TSK-1624 (the maintainer, 2026-11-14): Avatar and Cast, bigger and each in its own colour. */
    header strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #stage-avatar, #stage-cast { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 8px 16px; border: 2px solid; border-radius: 999px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.4); }
    #stage-avatar { color: #fff; background-color: #1e4e79; background-image: linear-gradient(135deg, #2b6cb0, #1e4e79); border-color: #7cc0ee; }
    #stage-cast { color: #10161f; background: linear-gradient(135deg, #ffcc4d, #e09a14); border-color: #ffe08a; }
    #stage-avatar:hover, #stage-cast:hover { filter: brightness(1.12); }
    #stage-avatar:focus-visible, #stage-cast:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    #stage-avatar[hidden], #stage-cast[hidden] { display: none; }
    /* On a narrow screen, the icon alone; its name still reads aloud. */
    @media (max-width: 720px) {
      header { gap: 10px; padding: 10px 12px; }
      #stage-avatar, #stage-cast { font-size: 0; padding: 7px 10px; }
      #stage-avatar span, #stage-cast span { font-size: 18px; }
    }
    #stage-avatar-panel { max-width: min(520px, calc(100vw - 32px)); color: #e2e8f0; background: #0e1520; border: 1px solid #2a3a4e; border-radius: 12px; padding: 20px; }
    #stage-avatar-panel::backdrop { background: rgb(0 0 0 / 0.55); }
    #stage-avatar-panel h2 { margin: 0 0 12px; font-size: 18px; }
    #stage-avatar-panel fieldset { border: 1px solid #2a3a4e; border-radius: 8px; margin: 0 0 12px; display: grid; gap: 6px; }
    .avatar-emblems { grid-template-columns: repeat(5, 1fr); }
    .avatar-emblems label { display: grid; justify-items: center; font-size: 28px; padding: 4px; border-radius: 8px; cursor: pointer; }
    .avatar-emblems label:has(input:checked) { background: #24364d; outline: 2px solid #8cb4c9; }
    .avatar-emblems input { position: absolute; opacity: 0; }
    .avatar-emblems label:has(input:focus-visible) { outline: 2px solid #f0b429; }
    .avatar-name { font-size: 11px; color: #9ca6ae; }
    .avatar-roles label { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
    #stage-avatar-panel menu { display: flex; justify-content: flex-end; gap: 8px; margin: 0; padding: 0; }
    #stage-avatar-panel menu button { font: inherit; color: #e2e8f0; background: #1a2332; border: 1px solid #2a3a4e; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
    #stage-avatar-panel menu button[type="submit"] { background: #2f6f9f; border-color: #3d86bd; }
    .avatar-status { min-height: 1.5em; margin: 0 0 8px; color: #9ca6ae; }
    /* KJC-TSK-1620: a workshop's tooltip. */
    #stage-tip { position: fixed; z-index: 5; max-width: 340px; padding: 8px 10px; border-radius: 8px; border: 1px solid #2a3a4e; background: rgb(14 21 32 / 0.95); color: #e2e8f0; font-size: 13px; line-height: 1.4; pointer-events: none; overflow-wrap: anywhere; }
    #stage-tip div:first-child { font-weight: 700; }
    #stage-tip div + div { color: #8cb4c9; }
    /* KJC-TSK-1621: a workshop's HU. */
    #stage-hu-panel { width: min(560px, calc(100vw - 32px)); color: #e2e8f0; background: #0e1520; border: 1px solid #2a3a4e; border-radius: 12px; padding: 20px; }
    #stage-hu-panel::backdrop { background: rgb(0 0 0 / 0.55); }
    .hu-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .hu-top h2 { margin: 0 0 12px; font-size: 18px; overflow-wrap: anywhere; }
    .hu-close { font: inherit; color: #e2e8f0; background: #1a2332; border: 1px solid #2a3a4e; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
    #stage-hu-panel dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 12px; }
    #stage-hu-panel dt { font-weight: 700; color: #8cb4c9; }
    #stage-hu-panel dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    #stage-hu-panel a { color: #8cb4c9; }
    /* KJC-TSK-1627: the task wall, large. */
    #stage-wall-panel { width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 48px); color: #e2e8f0; background: #0e1520; border: 1px solid #2a3a4e; border-radius: 12px; padding: 0 20px 20px; }
    #stage-wall-panel::backdrop { background: rgb(0 0 0 / 0.55); }
    .wall-top { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 16px 0 8px; background: #0e1520; }
    .wall-top h2 { margin: 0; font-size: 20px; }
    .wall-close { font: inherit; color: #e2e8f0; background: #1a2332; border: 1px solid #2a3a4e; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
    .wall-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .wall-columns h3 { margin: 0 0 8px; font-size: 15px; color: #8cb4c9; text-transform: uppercase; letter-spacing: 0.06em; }
    .wall-columns ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .wall-columns li { padding: 8px 10px; border-radius: 8px; background: #1a2332; border-left: 4px solid #8cb4c9; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
    /* KJC-TSK-1617: the cast legend, as collectable cards; each kind its frame's colour. */
    #stage-cast-panel { width: min(1180px, calc(100vw - 32px)); max-height: calc(100vh - 48px); color: #e2e8f0; background: #0b111a; border: 1px solid #2a3a4e; border-radius: 14px; padding: 0 20px 20px; }
    #stage-cast-panel::backdrop { background: rgb(0 0 0 / 0.6); }
    .cast-top { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 16px 0 10px; background: #0b111a; }
    .cast-top h2 { margin: 0; font-size: 22px; }
    .cast-langs { display: inline-flex; margin-left: auto; margin-right: 12px; border: 1px solid #2a3a4e; border-radius: 999px; overflow: hidden; }
    .cast-langs button { font: inherit; color: #c9d6e3; background: transparent; border: 0; padding: 6px 14px; cursor: pointer; }
    .cast-langs button[aria-pressed="true"] { color: #10161f; background: #f0b429; font-weight: 700; }
    .cast-close { font: inherit; color: #e2e8f0; background: #1a2332; border: 1px solid #2a3a4e; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
    #stage-cast-panel h3 { margin: 18px 0 10px; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: #9ca6ae; }
    .cast-cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .cast-card { --frame: #9ca6ae; height: 100%; box-sizing: border-box; padding: 10px; border-radius: 14px; border: 5px solid var(--frame); background: linear-gradient(160deg, color-mix(in srgb, var(--frame) 22%, #141c28), #111823 60%); box-shadow: 0 6px 18px rgb(0 0 0 / 0.45); font-size: 13px; line-height: 1.4; }
    .cast-agent { --frame: #f0b429; } .cast-crew { --frame: #34e07f; } .cast-piece { --frame: #4fb3e8; } .cast-tool { --frame: #b69cff; }
    .cast-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .cast-card h4 { margin: 0; font-size: 17px; }
    .cast-kind { flex: none; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--frame); }
    .cast-portrait { display: grid; place-items: center; height: 150px; margin: 8px 0; border-radius: 8px; border: 2px solid color-mix(in srgb, var(--frame) 60%, #000); background: radial-gradient(circle at 50% 35%, #2a3a50, #0e1520 75%); overflow: hidden; }
    .cast-portrait span { font-size: 56px; font-weight: 700; color: var(--frame); opacity: 0.8; }
    .cast-portrait img { width: 100%; height: 100%; object-fit: contain; }
    .cast-card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; }
    .cast-card dt { font-weight: 700; color: var(--frame); }
    .cast-card dd { margin: 0; }
    .cast-marks { margin: 8px 0 0; padding: 8px 0 0 16px; border-top: 1px solid #2a3a4e; }
    .cast-marks li { margin: 2px 0; }
  </style>
  <script type="importmap">{ "imports": { "three": "/stage/three.min.js" } }</script>
</head>
<body>
  <canvas id="stage" aria-label="Live 3D stage of the project: the method's pieces react to what Karajan does"></canvas>
  <header>
    <a href="/">← Board</a>
    <strong id="stage-project">kj stage</strong>
    <button type="button" id="stage-projects-toggle" aria-controls="stage-projects" aria-expanded="false">Projects</button>
    <a href="/stage.html?map=1">Every factory</a>
    <button type="button" id="stage-avatar" hidden><span aria-hidden="true">🎒</span>Avatar</button>
    <button type="button" id="stage-cast" aria-controls="stage-cast-panel" hidden><span aria-hidden="true">🃏</span>Cast</button>
  </header>
  <!-- KJC-TSK-1590: the projects; each opens its factory alone (main.js fills it). -->
  <nav id="stage-projects" aria-label="Projects"><p>Loading the projects…</p><ul></ul></nav>
  <!-- KJC-TSK-1570: the panel to pick the own emblem and each role's colour (avatar-panel.js). -->
  <dialog id="stage-avatar-panel" aria-labelledby="avatar-title"></dialog>
  <!-- KJC-TSK-1617: the legend of the characters, as collectable cards (legend-panel.js). -->
  <dialog id="stage-cast-panel" aria-labelledby="cast-title"></dialog>
  <!-- KJC-TSK-1620: a workshop's whole name and HU under the pointer. -->
  <div id="stage-tip" role="tooltip" hidden></div>
  <!-- KJC-TSK-1621: a workshop's HU from the board, to read (hu-panel.js). -->
  <dialog id="stage-hu-panel" aria-labelledby="hu-title"></dialog>
  <!-- KJC-TSK-1627: the task wall, large (wall-panel.js). -->
  <dialog id="stage-wall-panel" aria-labelledby="wall-title"></dialog>
  <!-- KJC-TSK-1468: until the stage says its first word, so it never looks dead. -->
  <output id="stage-loading" aria-live="polite">Loading the factories…</output>
  <!-- What the scene shows, as text: the last state of each piece, then each live cue. -->
  <ul id="stage-status" aria-live="polite"></ul>
  <!-- The crew's workshop talk: ambient, so screen readers skip it. -->
  <!-- Burst counts over the crates on the line; the status list already tells each event. -->
  <div id="stage-counts" aria-hidden="true"></div>
  <script type="module" src="/stage/main.js"></script>
</body>
</html>
