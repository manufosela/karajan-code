version: 1
rules:
  - id: R-06ecf6cdfb
    source: AGENTS.md
    text: 'Interactive wizards: The coder runs without stdin. Tasks requiring pnpm create astro, npm init, etc. must use --yes/--no-input flags or report that they cannot complete.'
    kind: deterministic
    when:
      tool: Bash
      all:
        - arg: command
          matches: (^|&&|\|\||;|\||\()\s*((sudo|command|time|env|nohup|exec)\s+|[A-Za-z_][A-Za-z0-9_]*=\S+\s+)*(?:(?![^\n;|&]*(?:\\\n[^\n;|&]*)*(?:\s|\\\n)(--yes|-y|--no-input|--help|-h)(\s|$))(pnpm|npm|yarn|bun)(\s+-{1,2}[\w-]+(=\S+|\s+[^-\s]\S*)?)*\s+(create|init)(?![\w-])|(?![^\n;|&]*?\screate-\S+(?=\s|\\|$)[^\n;|&]*(?:\\\n[^\n;|&]*)*(?:\s|\\\n)(--yes|-y|--no-input|--help|-h)(\s|$))(npx|bunx|pnpm\s+dlx|yarn\s+dlx|npm\s+(exec|x))(\s+-{1,2}[\w-]+(=\S+|\s+[^-\s]\S*)?)*(\s+--)?\s+create-\S+)
    message: 'Sin stdin, un asistente interactivo se queda colgado: añade --yes o --no-input, o informa de que no se puede completar.'
    examples:
      deny:
        - tool: Bash
          input:
            command: pnpm create astro my-site
        - tool: Bash
          input:
            command: npm init
        - tool: Bash
          input:
            command: npm create
        - tool: Bash
          input:
            command: pnpm create vite my-app
        - tool: Bash
          input:
            command: npx create-next-app web
        - tool: Bash
          input:
            command: npx --no-install create-next-app web
        - tool: Bash
          input:
            command: npm exec create-next-app web
        - tool: Bash
          input:
            command: npm exec -- create-vite my-app
        - tool: Bash
          input:
            command: cd web && npm x --package=create-astro -- create-astro
        - tool: Bash
          input:
            command: NODE_OPTIONS=--max-old-space-size=4096 pnpm create astro my-site
        - tool: Bash
          input:
            command: env CI=0 npm exec create-next-app web
        - tool: Bash
          input:
            command: npx --yes create-next-app web
      allow:
        - tool: Bash
          input:
            command: npm exec -- create-next-app web --yes
        - tool: Bash
          input:
            command: npm exec -- eslint src
        - tool: Bash
          input:
            command: pnpm create astro --help
        - tool: Bash
          input:
            command: npm init --help
        - tool: Bash
          input:
            command: pnpm create astro my-site --yes
        - tool: Bash
          input:
            command: npm init -y
        - tool: Bash
          input:
            command: npm --yes init
        - tool: Bash
          input:
            command: pnpm -y create astro my-site
        - tool: Bash
          input:
            command: |-
              pnpm create astro my-site \
                --yes
  - id: R-ad957b435f
    kind: judgment
    when:
      tool: Bash
    source: AGENTS.md
    text: 'Security findings are never overridable — not even by arbitration. You absorb the security role: kj brief security states what must be true. Task touches auth, user input, secrets, network or deps? Run kj audit --security (zero tokens) and remediate BEFORE the review.'
  - id: R-2583211f73
    kind: judgment
    when:
      tool: mcp__planning-game*__update_card
    source: AGENTS.md
    text: A non-trivial plan names at least two approaches — one as if the codebase didn't exist — and says why the winner won. Following the legacy line is a choice, never a default.
  - id: R-501de9df44
    reason: 'un mensaje pasado con -F o con --body-file está en un fichero que la condición no puede leer, y la lectura se corta en el primer &&, || o ; para no juzgar el comando siguiente (un mensaje que lleve uno antes del crédito tampoco se ve): esa parte la vigilan el hook commit-msg y la CI'
    kind: deterministic
    when:
      tool: Bash
      all:
        - arg: command
          matches: (^|&&|\|\||;|\||\(|\b(?:bash|sh|zsh|dash)\s+(?:-\w+\s+)*-\w*c\s+['"]?)\s*((sudo|command|time|env|nohup|exec)\s+|[A-Za-z_][A-Za-z0-9_]*=\S+\s+)*(git\s+(-[cC]\s+(?:"[^"]*"|'[^']*'|[^\s"'])+\s+|--[\w-]+(=(?:"[^"]*"|'[^']*'|[^\s"'])+)?\s+)*commit\b|gh\s+(-{1,2}[\w-]+(=\S+|\s+[^-\s]\S*)?\s+)*pr\s+(create|edit)\b)(?:(?!&&|\|\||;)[\s\S])*([Cc][Oo]-[Aa][Uu][Tt][Hh][Oo][Rr][Ee][Dd]-[Bb][Yy]|\b[Gg]enerated\s+([Ww]ith|[Bb]y|[Uu]sing)\s+\[?(the\s+|an?\s+)?(Claude|ChatGPT|GPT|OpenAI|Anthropic|(GitHub\s+)?Copilot|Codex|Gemini|Cursor|(large\s+)?language\s+model|artificial\s+intelligence|AI\b|LLM\b|assistant\b|model\b|agent\b|bot\b)|\b([Ww]ritten|[Cc]reated|[Aa]uthored)\s+([Ww]ith|[Bb]y|[Uu]sing)\s+\[?(the\s+|an?\s+)?(Claude|ChatGPT|GPT-?\d*|OpenAI|Anthropic|(GitHub\s+)?Copilot|Codex|Gemini|Cursor|(large\s+)?language\s+model|AI\b|LLM\b))
    message: 'Los commits y las PRs no llevan atribución a IA: quita Co-Authored-By, el generated by y cualquier written o created by con una IA.'
    examples:
      deny:
        - tool: Bash
          input:
            command: 'git commit -m ''fix: x'' -m ''Co-Authored-By: Some AI <ai@example.com>'''
        - tool: Bash
          input:
            command: gh pr create --title x --body 'Generated with an assistant'
        - tool: Bash
          input:
            command: 'git commit -m ''feat: x'' -m ''Generated by a language model'''
        - tool: Bash
          input:
            command: gh pr create --title x --body 'Written by Claude'
        - tool: Bash
          input:
            command: 'git commit -m ''feat: x'' -m ''Created with ChatGPT'''
        - tool: Bash
          input:
            command: gh pr edit 3 --body 'Authored using GitHub Copilot'
        - tool: Bash
          input:
            command: git commit -m 'Generated using ChatGPT'
        - tool: Bash
          input:
            command: 'sudo git commit -m ''x'' -m ''Co-Authored-By: Claude <x>'''
        - tool: Bash
          input:
            command: 'bash -c ''git commit -m "x" -m "Co-Authored-By: Claude <x>"'''
        - tool: Bash
          input:
            command: 'git -c user.name="Some Dev" -c user.email=dev@example.com commit -m ''feat: x'' -m ''Co-Authored-By: Claude <x>'''
        - tool: Bash
          input:
            command: 'git -c "user.name=Some Dev" commit -m ''feat: x'' -m ''Co-Authored-By: Claude <x>'''
        - tool: Bash
          input:
            command: 'git -C "/path/with spaces" commit -m ''feat: x'' -m ''Co-Authored-By: Claude <x>'''
      allow:
        - tool: Bash
          input:
            command: 'printf ''%s\n'' ''git commit -m "x" -m "Co-Authored-By: Claude <x>"'''
        - tool: Bash
          input:
            command: gh pr create --title x --body 'The report was generated with production fixtures'
        - tool: Bash
          input:
            command: gh pr create --title x --body 'The tag is created by the release bot'
        - tool: Bash
          input:
            command: 'git commit -m ''docs: written by the maintainers'''
        - tool: Bash
          input:
            command: 'git commit -m "fix: x"&& grep -c "Co-Authored-By:" CONTRIBUTING.md'
        - tool: Bash
          input:
            command: git -c user.name=dev commit -F msg
        - tool: Bash
          input:
            command: gh pr create --title x --body-file pr.md
    source: AGENTS.md
    text: Never attribute commits or PRs to AI (no Co-Authored-By, no "generated by").
  - id: R-6065f9fad1
    source: AGENTS.md
    text: Test-first. Run the tests after each meaningful change. Never skip tests.
    kind: judgment
    when:
      tool: Bash
    reason: 'depende de lo que pasó antes de la llamada o del estado del repo, que una condición no ve: lo imponen los hooks de git y la CI'
  - id: R-208825b183
    kind: judgment
    when:
      tool: Bash
    source: AGENTS.md
    text: Never commit secrets, keys or tokens. Parameterized queries; sanitize output against injection.
  - id: R-963c097258
    source: AGENTS.md
    text: Edit existing files in place; never overwrite a whole file to make a small change.
    kind: judgment
    when:
      tool: Write
    reason: que el fichero ya exista no está en los argumentos de la llamada
  - id: R-c73ee958e8
    source: AGENTS.md
    text: 'ES2025 target: never var, document.write, alert/confirm/prompt, escape/unescape, substr. Prefer modern APIs (structuredClone, Object.groupBy, Array.at/findLast/toSorted, optional chaining, ??).'
    kind: judgment
    when: &ref_0
      tool:
        - Edit
        - Write
    reason: 'las palabras prohibidas también son texto corriente, nombres de método o comentarios, y una condición denegaría ediciones honestas: lo vigila ESLint'
  - id: R-059b4ba0fb
    source: AGENTS.md
    text: ES modules (import/export), never require in new code. Avoid any in TypeScript.
    kind: judgment
    when: *ref_0
    reason: 'las palabras prohibidas también son texto corriente, nombres de método o comentarios, y una condición denegaría ediciones honestas: lo vigila ESLint'
  - id: R-306abef7b6
    source: AGENTS.md
    text: Up to 200 LOC is allowed without asking. If a task clearly needs >200 LOC, partition it upfront (multiple PRs, multiple HUs, multiple commits). Don't ship a single 500-LOC PR — the gate rejects it, the work gets redone, tokens burn twice.
    kind: out-of-scope
    reason: 'the size is of the whole branch: one tool call cannot measure it; kj pr-size and the shrink-budget CI gate enforce it'
  - id: R-6877f505fc
    source: AGENTS.md
    text: 'The project RAG answers before you assume: kj rag query — never guess what the codebase does. In MCP hosts the same index is the native kj_rag_query tool: reach for it before grepping by hand. Questions about the project''s docs, notes, ADRs or plans: ask qmd (its MCP) first.'
    kind: judgment
    when:
      tool: Grep
  - id: R-d5047ffe63
    source: AGENTS.md
    text: 'Every diff is reviewed by a DIFFERENT AI before it is committed (kj review --staged): verdicts bind to the exact diff — change the code and it must be reviewed again. Disagree with a rejection? kj solomon. A correction from the other AI is the method working: apply it and move on, no apology, and never report it as your mistake.'
    kind: judgment
    when:
      tool: Bash
  - id: R-b6f988cf71
    source: AGENTS.md
    text: 'A design decision the card''s AC don''t cover belongs to the USER: record it as a proposed ADR (kj adr add) and ask — never bury it in a PR bullet. Diff size: ~150 net lines of code is the ideal, up to 200 is allowed without asking, above 200 partition, always.'
    kind: out-of-scope
    reason: it is about what the answer says or how the work is chosen, no single tool call breaks it
  - id: R-a99ca8132b
    source: AGENTS.md
    text: 'Tests prove behavior: failing test first (TDD), suite never left red. Green is not proof: with method_gates.mutation declared, run kj mutate --since <base> and kill surviving mutants (weak asserts); then simplify (same behavior, no test weakened). Both BEFORE the review.'
    kind: judgment
    when:
      tool: Bash
  - id: R-25366572ab
    source: AGENTS.md
    text: 'Branch first: never commit on the base branch — every change reaches it through an atomic PR (~150 net lines of code, the project''s own commitlint convention; human docs, lockfiles, snapshots and dist/ do not count, AI-rule files do). More than one task, or the base tree must stay untouched? kj worktree start <slug> (one lane per task; kj worktree done <slug> after merge). Never CLAIM isolation without proof: in a lane, git rev-parse --git-dir differs from --git-common-dir.'
    kind: judgment
    when:
      tool: Bash
  - id: R-c69c02b001
    source: AGENTS.md
    text: 'A kj gate stopped you? The working-with-karajan skill says how to go on. Hit a kj bug or friction? Diagnose it and file it upstream with kj report-issue (sanitized; ask your user before --publish). kj announces a newer version? Tell your user what it brings and ask — never run kj update on your own. Something only your user can do (publish, seal, run a script)? Register it: kj handoff add <command> --why "<what for>"; they follow kj handoff watch. kj''s human acts (kj harden --commit, kj rules approve, kj identity enroll-phone) are typed by your user in their own terminal: never put them in a script or run them with bash; kj refuses anything an agent launched.'
    kind: deterministic
    reason: 'the calls the text names by command: kj update and the three human acts, run by the agent, directly or through bash -c; registering one for the user (kj handoff add) is what the text asks, so the act quoted as the command of kj handoff add is not denied, while one run beside it is: the lookbehind (?<!kj handoff add "...) skips every start position inside that quoted argument, && included, as the allow examples prove'
    when:
      tool: Bash
      all:
        - arg: command
          matches: (?:^|&&|\|\||;|\||\(|\b(?:bash|sh|zsh|dash)\s+(?:-\w+\s+)*-\w*c\s+['"]?)\s*(?<!\bkj\s+handoff\s+add\s+["'][^"']*)((sudo(\s+-\S+)*|command|exec|nohup|time|env(\s+-\S+)*)\s+|\w+=\S*\s+)*(\S*/)?kj\s+(update\b|rules\s+approve\b|identity\s+enroll-phone\b|harden\b[^;&|'"]*--commit\b)
    message: 'kj update y los actos humanos de kj (kj harden --commit, kj rules approve, kj identity enroll-phone) no los lanzas tú: para kj update, cuéntale a tu usuario qué trae y pregúntale; para un acto humano, regístralo con kj handoff add y lo teclea él.'
    examples:
      deny:
        - tool: Bash
          input:
            command: kj update
        - tool: Bash
          input:
            command: command kj update
        - tool: Bash
          input:
            command: env KJ_FLAG=value kj update
        - tool: Bash
          input:
            command: KJ_FLAG=1 /usr/local/bin/kj update
        - tool: Bash
          input:
            command: kj --version && kj update
        - tool: Bash
          input:
            command: cd /repo/.kj/worktrees/x && kj harden --commit
        - tool: Bash
          input:
            command: kj rules approve
        - tool: Bash
          input:
            command: kj identity enroll-phone --label mine
        - tool: Bash
          input:
            command: bash -c 'kj harden --commit'
        - tool: Bash
          input:
            command: sh -lc "kj rules approve"
        - tool: Bash
          input:
            command: sudo kj harden --commit
        - tool: Bash
          input:
            command: sudo -E kj update
        - tool: Bash
          input:
            command: kj harden --commit && kj handoff add "kj harden --commit" --why x
        - tool: Bash
          input:
            command: kj update; kj handoff add "kj update" --why x
      allow:
        - tool: Bash
          input:
            command: cd /repo && kj handoff add "kj harden --commit" --why "seal the re-harden"
        - tool: Bash
          input:
            command: kj handoff add "cd /repo && kj harden --commit" --why "..."
        - tool: Bash
          input:
            command: kj --version
        - tool: Bash
          input:
            command: kj report-issue --title x
        - tool: Bash
          input:
            command: kj harden
        - tool: Bash
          input:
            command: kj rules check
        - tool: Bash
          input:
            command: kj handoff add "cd /repo/.kj/worktrees/x && kj harden --commit" --why "seal the re-harden"
