version: 1
rules:
  - id: R-06ecf6cdfb
    source: CLAUDE.md
    text: 'Interactive wizards: The coder runs without stdin. Tasks requiring pnpm create astro, npm init, etc. must use --yes/--no-input flags or report that they cannot complete.'
    kind: deterministic
    when:
      tool: Bash
      all:
        - arg: command
          matches: (^|&&|\|\||;|\||\()(?![^\n;|&]*\s(--yes|-y|--no-input)(\s|$))\s*((pnpm|npm|yarn|bun)(\s+-{1,2}[\w-]+(=\S+|\s+[^-\s]\S*)?)*\s+(create\s+\S+|init)|(npx|bunx|pnpm\s+dlx|yarn\s+dlx)(\s+-{1,2}[\w-]+(=\S+|\s+[^-\s]\S*)?)*\s+create-\S+)
    message: 'Sin stdin, un asistente interactivo se queda colgado: añade --yes o --no-input, o informa de que no se puede completar.'
    examples:
      deny:
        - tool: Bash
          input:
            command: pnpm create astro my-site
        - tool: Bash
          input:
            command: npm init
        - tool: Bash
          input:
            command: pnpm create vite my-app
        - tool: Bash
          input:
            command: npx create-next-app web
        - tool: Bash
          input:
            command: npx --no-install create-next-app web
      allow:
        - tool: Bash
          input:
            command: pnpm create astro my-site --yes
        - tool: Bash
          input:
            command: npm init -y
        - tool: Bash
          input:
            command: pnpm --yes create astro my-site
  - id: R-acaedb5bb0
    source: CLAUDE.md
    text: 'Tests prove behavior: the failing test exists first (TDD), and the suite is never left red. Green is not proof: with method_gates.mutation declared, run kj mutate --since <base> after green and BEFORE the review — a surviving mutant is a weak assert; kill it first.'
    kind: judgment
    when: &ref_0
      tool: Bash
    reason: 'depende de lo que pasó antes de la llamada o del estado del repo, que una condición no ve: lo imponen los hooks de git y la CI'
  - id: R-ad957b435f
    kind: judgment
    when:
      tool: Bash
    source: CLAUDE.md
    text: 'Security findings are never overridable — not even by arbitration. You absorb the security role: kj brief security states what must be true. Task touches auth, user input, secrets, network or deps? Run kj audit --security (zero tokens) and remediate BEFORE the review.'
  - id: R-2583211f73
    kind: judgment
    when:
      tool: mcp__planning-game*__update_card
    source: CLAUDE.md
    text: A non-trivial plan names at least two approaches — one as if the codebase didn't exist — and says why the winner won. Following the legacy line is a choice, never a default.
  - id: R-501de9df44
    reason: 'un mensaje pasado con -F o con --body-file está en un fichero que la condición no puede leer: esa parte la vigilan el hook commit-msg y la CI'
    kind: deterministic
    when:
      tool: Bash
      all:
        - arg: command
          matches: (^|&&|\|\||;|\||\()\s*((sudo|command|time|env|nohup|exec)\s+|[A-Za-z_][A-Za-z0-9_]*=\S+\s+)*(git\s+(-[cC]\s+\S+\s+|--[\w-]+(=\S+)?\s+)*commit\b|gh\s+(-{1,2}[\w-]+(=\S+|\s+[^-\s]\S*)?\s+)*pr\s+(create|edit)\b)(?:(?!\s(&&|\|\||;)\s)[\s\S])*([Cc][Oo]-[Aa][Uu][Tt][Hh][Oo][Rr][Ee][Dd]-[Bb][Yy]|\b[Gg]enerated\s+([Ww]ith|[Bb]y)\s+\[?(the\s+|an?\s+)?(Claude|ChatGPT|GPT|OpenAI|Anthropic|(GitHub\s+)?Copilot|Codex|Gemini|Cursor|(large\s+)?language\s+model|artificial\s+intelligence|AI\b|LLM\b|assistant\b|model\b|agent\b|bot\b))
    message: 'Los commits y las PRs no llevan atribución a IA: quita Co-Authored-By y el generated by.'
    examples:
      deny:
        - tool: Bash
          input:
            command: 'git commit -m ''fix: x'' -m ''Co-Authored-By: Some AI <ai@example.com>'''
        - tool: Bash
          input:
            command: gh pr create --title x --body 'Generated with an assistant'
        - tool: Bash
          input:
            command: 'git commit -m ''feat: x'' -m ''Generated by a language model'''
      allow:
        - tool: Bash
          input:
            command: gh pr create --title x --body 'The report was generated with production fixtures'
        - tool: Bash
          input:
            command: git -c user.name=dev commit -F msg
        - tool: Bash
          input:
            command: gh pr create --title x --body-file pr.md
    source: CLAUDE.md
    text: Never attribute commits or PRs to AI (no Co-Authored-By, no "generated by").
  - id: R-6065f9fad1
    source: CLAUDE.md
    text: Test-first. Run the tests after each meaningful change. Never skip tests.
    kind: judgment
    when: *ref_0
    reason: 'depende de lo que pasó antes de la llamada o del estado del repo, que una condición no ve: lo imponen los hooks de git y la CI'
  - id: R-208825b183
    kind: judgment
    when:
      tool: Bash
    source: CLAUDE.md
    text: Never commit secrets, keys or tokens. Parameterized queries; sanitize output against injection.
  - id: R-963c097258
    source: CLAUDE.md
    text: Edit existing files in place; never overwrite a whole file to make a small change.
    kind: judgment
    when:
      tool: Write
    reason: que el fichero ya exista no está en los argumentos de la llamada
  - id: R-c73ee958e8
    source: CLAUDE.md
    text: 'ES2025 target: never var, document.write, alert/confirm/prompt, escape/unescape, substr. Prefer modern APIs (structuredClone, Object.groupBy, Array.at/findLast/toSorted, optional chaining, ??).'
    kind: judgment
    when: &ref_1
      tool:
        - Edit
        - Write
    reason: 'las palabras prohibidas también son texto corriente, nombres de método o comentarios, y una condición denegaría ediciones honestas: lo vigila ESLint'
  - id: R-059b4ba0fb
    source: CLAUDE.md
    text: ES modules (import/export), never require in new code. Avoid any in TypeScript.
    kind: judgment
    when: *ref_1
    reason: 'las palabras prohibidas también son texto corriente, nombres de método o comentarios, y una condición denegaría ediciones honestas: lo vigila ESLint'
  - id: R-306abef7b6
    source: CLAUDE.md
    text: Up to 200 LOC is allowed without asking. If a task clearly needs >200 LOC, partition it upfront (multiple PRs, multiple HUs, multiple commits). Don't ship a single 500-LOC PR — the gate rejects it, the work gets redone, tokens burn twice.
    kind: out-of-scope
    reason: 'the size is of the whole branch: one tool call cannot measure it; kj pr-size and the shrink-budget CI gate enforce it'
  - id: R-6877f505fc
    source: CLAUDE.md
    text: 'The project RAG answers before you assume: kj rag query — never guess what the codebase does. In MCP hosts the same index is the native kj_rag_query tool: reach for it before grepping by hand. Questions about the project''s docs, notes, ADRs or plans: ask qmd (its MCP) first.'
    kind: judgment
    when:
      tool: Grep
  - id: R-d5047ffe63
    source: CLAUDE.md
    text: 'Every diff is reviewed by a DIFFERENT AI before it is committed (kj review --staged): verdicts bind to the exact diff — change the code and it must be reviewed again. Disagree with a rejection? kj solomon. A correction from the other AI is the method working: apply it and move on, no apology, and never report it as your mistake.'
    kind: judgment
    when: &ref_2
      tool: Bash
  - id: R-814943602a
    source: CLAUDE.md
    text: 'The panel is your user''s, not yours: coder=claude, reviewer=codex, solomon=agy. When the coder is not you, the writing is ITS job; write it yourself anyway and say so in your closing message, never in silence.'
    kind: out-of-scope
    reason: it is about what the answer says or how the work is chosen, no single tool call breaks it
  - id: R-b6f988cf71
    source: CLAUDE.md
    text: 'A design decision the card''s AC don''t cover belongs to the USER: record it as a proposed ADR (kj adr add) and ask — never bury it in a PR bullet. Diff size: ~150 net lines of code is the ideal, up to 200 is allowed without asking, above 200 partition, always.'
    kind: out-of-scope
    reason: it is about what the answer says or how the work is chosen, no single tool call breaks it
  - id: R-9592b2509c
    source: CLAUDE.md
    text: 'Branch first: never commit on the base branch — every change reaches it through an atomic PR (~150 net lines of code, Conventional Commits; human docs, lockfiles, snapshots and dist/ do not count, AI-rule files do). More than one task, or the base tree must stay untouched? kj worktree start <slug> (one lane per task; kj worktree done <slug> after merge). Never CLAIM isolation without proof: in a lane, git rev-parse --git-dir differs from --git-common-dir.'
    kind: judgment
    when: *ref_2
  - id: R-ab03f7b323
    source: CLAUDE.md
    text: 'Hit a kj bug or friction? Diagnose it and file it upstream with kj report-issue (sanitized; ask your user before --publish). kj announces a newer version? Tell your user what it brings and ask — never run kj update on your own. Something only your user can do (publish, seal, run a script)? Register it: kj handoff add <command> --why "<what for>"; they follow kj handoff watch.'
    kind: deterministic
    when:
      tool: Bash
      all:
        - arg: command
          matches: (^|&&|\|\||;|\||\()\s*kj\s+update\b
    message: 'kj update no lo lanzas tú: cuéntale a tu usuario qué trae la versión nueva y pregúntale.'
    examples:
      deny:
        - tool: Bash
          input:
            command: kj update
        - tool: Bash
          input:
            command: kj --version && kj update
      allow:
        - tool: Bash
          input:
            command: kj --version
        - tool: Bash
          input:
            command: kj report-issue --title x
  - id: R-2041581b32
    source: AGENTS.md
    text: Up to 200 LOC is allowed without asking. If a task clearly needs >200 LOC, partition it upfront (multiple PRs, multiple HUs, multiple commits). Don't ship a single 500-LOC PR — the gate rejects it, work gets redone, tokens burn twice.
    kind: out-of-scope
    reason: 'the size is of the whole branch: one tool call cannot measure it; kj pr-size and the shrink-budget CI gate enforce it'
