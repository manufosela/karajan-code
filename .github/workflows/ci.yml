name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # node --check catches parse-time syntax/import bugs. Node 20 was dropped
  # in v3.0.0 (KJC-TSK-0500, 2026-06-03) when engines.node moved to >=22.12.0
  # — Node 20 reaches EOL on 2026-04-30 and three deps (lint-staged 17,
  # commander 15, better-sqlite3 12.10+) required the bump.
  syntax:
    name: Syntax (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (node --check — parse-time syntax)
        run: npm run lint:syntax

  # Conventional Commits enforcement on PR head. Closes the
  # ai-harness-scorecard "Mechanical Constraints / Conventional Commits"
  # FAIL by adding CI-side enforcement on top of the local pre-commit hook
  # (KJC-TSK-0466, 2026-05-27). wagoid/commitlint-github-action handles
  # checkout depth, fetches the PR commit range, and runs commitlint with
  # the config in .commitlintrc.json.
  commitlint:
    name: Commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    # `imported-history` (MONO fusions, ADR 0002): a repo import carries its
    # era's messages verbatim — rewriting them to satisfy today's rules would
    # falsify history. The label skips ONLY this check, never the code gates.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'imported-history')

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Lint PR commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json
          failOnWarnings: false

  # Prettier check — blocks PRs whose formatting drifts from the repo's
  # .prettierrc.json. Added in KJC-TSK-0464 (2026-05-26) to close the
  # ai-harness-scorecard "Formatter Enforcement" FAIL. Scope is
  # intentionally small (workflows + root config) per .prettierignore;
  # additional directories are folded in by future PRs to keep each
  # change under the shrink-budget LOC cap.
  format:
    name: Format (Prettier --check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format (Prettier --check)
        run: npm run format:check

  # ESLint runs on the same Node matrix as syntax (22/24). engines.node
  # is now >=22.12.0 (v3.0.0, KJC-TSK-0500).
  lint:
    name: Lint (ESLint, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint — no-undef + import resolution)
        run: npm run lint

  # Tests run on Node 22/24 — engines.node floor is now >=22.12.0 (v3.0.0).
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=github-actions

      # The hu-board package ships its own package.json + vitest config,
      # and the root vitest run excludes packages/** — so without these
      # two steps its test suite never runs in CI. Regression cover for
      # the 2026-05 dogfooding where a broken packages/hu-board change
      # would have passed CI unnoticed.
      - name: Install hu-board package dependencies
        run: npm ci
        working-directory: packages/hu-board

      - name: Run hu-board package tests
        run: npx vitest run --reporter=default --reporter=github-actions
        working-directory: packages/hu-board

      # Same blind spot, same fix as hu-board above: the root vitest run
      # excludes packages/**, so karajan-core's own suite must run here.
      - name: Run karajan-core package tests
        run: npx vitest run --reporter=default --reporter=github-actions
        working-directory: packages/core

  # Coverage report — generates v8 coverage (text + html + lcov) and uploads
  # the lcov + html as an artifact for download. Added in KJC-TSK-0465 (2026-05-27)
  # to close the ai-harness-scorecard "Code Coverage" FAIL (0/4 → 4/4). Thresholds
  # remain advisory (see vitest.config.js): the job uses continue-on-error so a
  # threshold miss never blocks an unrelated PR while we are climbing back to the
  # configured targets.
  coverage:
    name: Coverage (v8)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-v8
          path: coverage/
          retention-days: 14
