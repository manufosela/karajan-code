name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # node --check runs on 20/22 to catch parse-time syntax/import bugs.
  # Node 18 was dropped 2026-04-30 (audit cleanup): Node 18 LTS hit EOL on
  # 2025-04-30 and engines.node is now >=20.10.0.
  syntax:
    name: Syntax (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (node --check — parse-time syntax)
        run: npm run lint:syntax

  # ESLint runs on the same Node matrix as syntax (20/22). Pre-2026-04-30
  # this used to mention "Node 18 users still get parse-time guarantees" —
  # no longer relevant now that engines.node = >=20.10.0.
  lint:
    name: Lint (ESLint, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint — no-undef + import resolution)
        run: npm run lint

  # Tests run on Node 20/22 — the engine floor is now also >=20.10.0
  # so this matrix matches the supported runtime range.
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=github-actions

      # The hu-board package ships its own package.json + vitest config,
      # and the root vitest run excludes packages/** — so without these
      # two steps its test suite never runs in CI. Regression cover for
      # the 2026-05 dogfooding where a broken packages/hu-board change
      # would have passed CI unnoticed.
      - name: Install hu-board package dependencies
        run: npm ci
        working-directory: packages/hu-board

      - name: Run hu-board package tests
        run: npx vitest run --reporter=default --reporter=github-actions
        working-directory: packages/hu-board
