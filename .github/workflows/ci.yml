name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint (node --check) runs on 18/20/22 to catch syntax/import bugs that would
  # break runtime for users on Node 18 LTS (package.json engines: >=18.0.0).
  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint — no-undef + import resolution)
        run: npm run lint

      - name: Lint (node --check — parse-time syntax)
        run: npm run lint:syntax

  # Tests are restricted to Node 20+. vitest 4 / rolldown (a devDependency)
  # uses `styleText` from `node:util` which only exists on Node 20.12+. The
  # KARAJAN RUNTIME itself works on Node 18 — rolldown is never pulled into a
  # user install. If/when vitest regains Node 18 support, add 18.x back here.
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=github-actions
