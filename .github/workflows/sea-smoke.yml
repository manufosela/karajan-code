name: SEA macOS smoke

# The macOS SEA binary can only be built and run on macOS, and Node upstream
# only CI-tests single-executables on Linux. This job builds the darwin-arm64
# binary and asserts it boots, so a startup segfault (KJC-BUG-0096) is caught
# on the PR instead of at release time. Runs on demand and whenever the SEA
# build changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build-sea.mjs"
      - "scripts/esbuild-sea.config.mjs"
      - ".github/workflows/sea-smoke.yml"

jobs:
  smoke:
    name: Build + boot darwin-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build SEA binary
        run: node scripts/build-sea.mjs

      - name: Boot smoke-test
        run: |
          set -euo pipefail
          ./dist/kj --version
          ./dist/kj --help >/dev/null
          ./dist/kj init --help >/dev/null
          echo "Smoke OK: darwin-arm64 binary boots."

      # KJC-BUG-0097 — booting is not enough: the SEA bundler once stubbed out
      # src/rag/auto-update.js and `kj run` crashed with "maybeAutoUpdate is not
      # a function" while --version/--help/init stayed green. Exercise the run
      # dispatch far enough to prove the bundle wires up. No agent is installed
      # here, so the command is expected to FAIL later — we only assert it does
      # NOT die with a missing-symbol error. perl's alarm guards against a hang.
      - name: Run-dispatch smoke-test
        run: |
          set -uo pipefail
          kj_bin="$PWD/dist/kj"
          repo="$(mktemp -d)"
          git -C "$repo" init -q
          git -C "$repo" -c user.email=kj@test.local -c user.name=kj \
            commit -q --allow-empty -m "seed"
          out="$(cd "$repo" && perl -e 'alarm 30; exec @ARGV' \
            "$kj_bin" run "smoke probe" </dev/null 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -Eq "is not a function|is not defined"; then
            echo "FAIL: kj run crashed on a missing bundled symbol." >&2
            exit 1
          fi
          echo "Run-dispatch OK: no missing-symbol crash."

      # If the binary still crashes, surface the Mach-O layout and signature so
      # the next lead is visible in the run log instead of a bare exit 139.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "== exit-code probe =="; ./dist/kj --version; echo "exit=$?" || true
          echo "== NODE_SEA segment =="; otool -l dist/kj | grep -A3 NODE_SEA || echo "NODE_SEA segment NOT found"
          echo "== codesign verify =="; codesign -vvv --verify dist/kj || true
          echo "== spctl assess =="; spctl -a -vvv dist/kj || true
