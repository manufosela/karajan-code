name: Radar backend

# Radar lives at packages/radar in this monorepo. GitHub only runs workflows
# from the repo root, so the package's own .github/workflows never fire here;
# this mirrors packages/radar/.github/workflows/ci-backend.yml, path-filtered
# to the package and pinned to its working directory (KRD-TSK-0021).

on:
  push:
    branches: [main]
    paths:
      - "packages/radar/backend/**"
      - ".github/workflows/radar-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/radar/backend/**"
      - ".github/workflows/radar-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: karajan_radar_test
          POSTGRES_USER: radar_user
          POSTGRES_PASSWORD: radar_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar_user -d karajan_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://radar_user:radar_dev_password@localhost:5432/karajan_radar_test
      # Settings declares APP_SECRET_KEY with no default, so importing the app
      # fails without it. Not a real secret: it never leaves the CI run.
      APP_SECRET_KEY: ci-secret-key-not-used-outside-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: packages/radar/backend
        # The dev extra carries ruff, mypy and the test-only packages that the
        # steps below invoke; without it they are simply not installed.
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        working-directory: packages/radar/backend
        run: uv run ruff check .

      - name: Type check with mypy
        working-directory: packages/radar/backend
        run: uv run mypy app/

      - name: Run tests with coverage
        working-directory: packages/radar/backend
        run: uv run pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing -v

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-backend-coverage
          path: packages/radar/backend/coverage.xml
          retention-days: 7
