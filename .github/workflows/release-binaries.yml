name: Release SEA Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Force JS actions in this workflow to run on Node.js 24. GitHub will
# make this the default on 2026-06-02 and remove Node.js 20 from the
# runner on 2026-09-16. `actions/checkout@v5` and `actions/setup-node@v5`
# already declare Node 24, but `softprops/action-gh-release@v2` (used
# below to upload SEA binaries) still ships a Node 20 runtime in its
# action.yml; this env opts it into Node 24 today so we don't get the
# deprecation banner on every release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies (incl. esbuild + postject)
        run: npm ci

      - name: Build SEA binary
        run: node scripts/build-sea.mjs

      - name: Rename binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv dist/kj dist/kj-${{ matrix.target }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv dist/kj.exe dist/kj-${{ matrix.target }}.exe

      - name: Generate SHA256 checksum (Linux/macOS)
        if: runner.os != 'Windows'
        run: shasum -a 256 dist/kj-${{ matrix.target }} > dist/kj-${{ matrix.target }}.sha256

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        run: certutil -hashfile dist\kj-${{ matrix.target }}.exe SHA256 > dist\kj-${{ matrix.target }}.exe.sha256

      - name: Upload release assets (Linux/macOS)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kj-${{ matrix.target }}
            dist/kj-${{ matrix.target }}.sha256

      - name: Upload release assets (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kj-${{ matrix.target }}.exe
            dist/kj-${{ matrix.target }}.exe.sha256
