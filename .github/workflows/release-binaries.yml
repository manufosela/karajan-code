name: Release SEA Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Force JS actions in this workflow to run on Node.js 24. GitHub will
# make this the default on 2026-06-02 and remove Node.js 20 from the
# runner on 2026-09-16. `actions/checkout@v5` and `actions/setup-node@v5`
# already declare Node 24, but `softprops/action-gh-release@v2` (used
# below to upload SEA binaries) still ships a Node 20 runtime in its
# action.yml; this env opts it into Node 24 today so we don't get the
# deprecation banner on every release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # KJC-TSK-0591: make the SEA release self-sufficient. Pushing a `v*` tag
  # must never leave an orphan release or depend on a human remembering to
  # run `gh release create`. This job runs first (build `needs` it): if the
  # release already exists (created by hand) it is a no-op; otherwise it mints
  # the release from the CHANGELOG section for this version. Because the
  # release is guaranteed to exist before any matrix job uploads assets, this
  # also closes the KJC-BUG-0040 race (human create vs softprops).
  ensure-release:
    name: Ensure GitHub Release exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Ensure release from CHANGELOG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json id >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — nothing to do."
            exit 0
          fi
          VERSION="${TAG#v}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG section found for ${VERSION}. Add a '## [${VERSION}]' entry before tagging."
            exit 1
          fi
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file release-notes.md
          echo "Created release ${TAG} from CHANGELOG."

  build:
    name: Build ${{ matrix.target }}
    needs: ensure-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies (incl. esbuild + postject)
        run: npm ci

      - name: Build SEA binary
        run: node scripts/build-sea.mjs

      - name: Rename binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv dist/kj dist/kj-${{ matrix.target }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv dist/kj.exe dist/kj-${{ matrix.target }}.exe

      # KJC-TSK-0592: never ship a binary that can't start. The SEA bundle
      # inlines its version and stubs the native-dep commands (board/rag), so
      # the gate mirrors verify-pack: assert the binary boots, its version
      # matches the tag, and the command tree resolves. This catches the
      # broken-bundle class (ERR_MODULE_NOT_FOUND) that shipped v3.4.1.
      - name: Smoke-test binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/kj-${{ matrix.target }}"
          EXPECTED="${GITHUB_REF_NAME#v}"
          GOT="$("./${BIN}" --version)"
          if [ "${GOT}" != "${EXPECTED}" ]; then
            echo "::error::version mismatch: got '${GOT}', expected '${EXPECTED}'"
            exit 1
          fi
          "./${BIN}" --help >/dev/null
          "./${BIN}" init --help >/dev/null
          echo "Smoke OK: ${BIN} reports ${GOT} and the command tree resolves."

      - name: Smoke-test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "dist\kj-${{ matrix.target }}.exe"
          $expected = $env:GITHUB_REF_NAME.TrimStart("v")
          $got = (& ".\$bin" --version).Trim()
          if ($got -ne $expected) {
            Write-Error "version mismatch: got '$got', expected '$expected'"
            exit 1
          }
          & ".\$bin" --help | Out-Null
          & ".\$bin" init --help | Out-Null
          Write-Host "Smoke OK: $bin reports $got and the command tree resolves."

      - name: Generate SHA256 checksum (Linux/macOS)
        if: runner.os != 'Windows'
        run: shasum -a 256 dist/kj-${{ matrix.target }} > dist/kj-${{ matrix.target }}.sha256

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        run: certutil -hashfile dist\kj-${{ matrix.target }}.exe SHA256 > dist\kj-${{ matrix.target }}.exe.sha256

      # KJC-BUG-0040 root cause: the release-create from the human's
      # release checklist (`gh release create`) and softprops fight for
      # the same tag. linux-x64 is always the fastest job in the matrix
      # so it reaches the upload step BEFORE GitHub has indexed the
      # release-by-tag — softprops then creates a duplicate DRAFT, uploads
      # there, and fails the final PATCH draft:false with 422 already_exists.
      # Result: linux assets end up in an orphan draft, the human's
      # release misses kj-linux-x64. Poll until the release is discoverable
      # so softprops finds it and uploads to the right place. 60 s window
      # is plenty for `gh release create` to land (typically <5 s).
      - name: Wait for release to be discoverable by tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "${GITHUB_REF_NAME}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --json id >/dev/null 2>&1; then
              echo "Release ${GITHUB_REF_NAME} is discoverable (attempt $i)."
              exit 0
            fi
            echo "Waiting for release ${GITHUB_REF_NAME} to be discoverable... ($i/30)"
            sleep 2
          done
          echo "::error::Release ${GITHUB_REF_NAME} not discoverable after 60 s. Was 'gh release create' run? Aborting to avoid creating a duplicate draft."
          exit 1

      - name: Upload release assets (Linux/macOS)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/kj-${{ matrix.target }}
            dist/kj-${{ matrix.target }}.sha256
          # Defensive: never mutate the human-created release's metadata.
          # We are only uploading assets to an existing release.
          make_latest: false
          append_body: false

      - name: Upload release assets (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/kj-${{ matrix.target }}.exe
            dist/kj-${{ matrix.target }}.exe.sha256
          make_latest: false
          append_body: false
