name: Radar frontend

# Mirrors packages/radar/.github/workflows/ci-frontend.yml, path-filtered to
# packages/radar/frontend and pinned to its working directory. GitHub only
# runs root workflows, so the package's own one never fires here (KRD-TSK-0021).

on:
  push:
    branches: [main]
    paths:
      - "packages/radar/frontend/**"
      - ".github/workflows/radar-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/radar/frontend/**"
      - ".github/workflows/radar-frontend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned: pnpm 11 requires a newer Node than the 20 used here and
          # dies with ERR_UNKNOWN_BUILTIN_MODULE. "latest" made this workflow
          # break without a change to the repository.
          version: 9

      - name: Install dependencies
        working-directory: packages/radar/frontend
        run: pnpm install --frozen-lockfile

      - name: Lint with ESLint
        working-directory: packages/radar/frontend
        run: pnpm lint

      - name: Type check with TypeScript
        working-directory: packages/radar/frontend
        run: pnpm exec tsc --noEmit

      - name: Run tests with coverage
        working-directory: packages/radar/frontend
        run: pnpm exec vitest run --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-frontend-coverage
          path: packages/radar/frontend/coverage/lcov.info
          retention-days: 7
