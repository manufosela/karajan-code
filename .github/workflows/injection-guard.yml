name: Injection Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    name: Scan PR for prompt injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Get PR diff
        # KJC-BUG-0072 — never interpolate ${{ github.* }} directly inside a
        # `run:` block. Fork PRs can choose `base_ref` and craft injection.
        # Pin to env and reference via "$BASE_REF" instead.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/${BASE_REF}...HEAD" \
            -- ':!src/utils/injection-guard.js' \
            ':!tests/**' \
            ':!packages/**/tests/**' \
            ':!packages/radar/backend/app/security/**' \
            ':!packages/radar/backend/profiles/**' \
            ':!packages/radar/backend/app/profiles/**' \
            ':!packages/radar/backend/app/corpus/documents.py' \
            ':!packages/radar/README.md' \
            ':!.github/workflows/*.yml' \
            ':!CHANGELOG.md' \
            ':!src/mcp/handlers/*' \
            ':!src/mcp/sovereignty-guard.js' \
            ':!src/mcp/server-handlers.js' \
            > /tmp/pr-diff.txt

      - name: Get PR metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json title,body --jq '.title + "\n" + .body' > /tmp/pr-meta.txt 2>/dev/null || echo "" > /tmp/pr-meta.txt

      - name: Scan for injection patterns
        run: |
          node --input-type=module << 'SCRIPT'
          import { scanDiff, scanForInjection } from "./src/utils/injection-guard.js";
          import { readFileSync } from "node:fs";

          const diff = readFileSync("/tmp/pr-diff.txt", "utf8");
          const meta = readFileSync("/tmp/pr-meta.txt", "utf8");

          const diffResult = scanDiff(diff);
          const metaResult = scanForInjection(meta);

          let failed = false;

          if (!diffResult.clean) {
            console.error("::error::Injection patterns detected in PR diff");
            for (const f of diffResult.findings) {
              console.error(`  [${f.type}] line ${f.line}: ${f.snippet}`);
            }
            failed = true;
          }

          if (!metaResult.clean) {
            console.warn("::warning::Injection patterns detected in PR title/description");
            for (const f of metaResult.findings) {
              console.warn(`  [${f.type}] line ${f.line}: ${f.snippet}`);
            }
            // Warning only — PR metadata is written by the author, not injected code
          }

          if (failed) {
            console.error("\nPR blocked: potential prompt injection detected.");
            console.error("If this is a false positive, a maintainer can override.");
            process.exit(1);
          }

          console.log("Injection guard: clean");
          SCRIPT
