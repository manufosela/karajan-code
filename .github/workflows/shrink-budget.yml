# Shrink Budget — prevents uncontrolled LOC growth.
#
# Fires on PRs to main and computes the net LOC delta (added - removed) of
# source files vs. the base branch. If a PR adds more than LOC_LIMIT net
# lines without paired removals, the job fails. Authors who legitimately
# need to grow the codebase (e.g. landing a vendored dependency, bringing in
# a new orchestrator stage) can apply the `large-pr-justified` label on
# the PR — the job is skipped entirely.
#
# A separate, non-blocking check warns when package.json adds new entries
# under `dependencies` or `devDependencies`. To silence the warning, apply
# the `new-dep-approved` label or justify the new dep in the PR body.
#
# Source: kj_audit 2026-05-03 finding #3 + manual reinforcement 2026-05-08 (codeQuality, high impact) —
# the repo grew +47% LOC in 4 weeks vs ~20% audit-driven cleanup.
# Ref: KJC-TSK-0352, GitHub issue #573.
name: Shrink Budget

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  # PL-C (KJC-TSK-0735): the limit's SINGLE SOURCE is .karajan/policy.yml
  # (invariant loc-budget). The step below extracts it fail-loud — a gate
  # that cannot find its threshold must not guess. `large-pr-justified`
  # label remains the one-off escape.
  KJ_POLICY_FILE: ".karajan/policy.yml"

jobs:
  loc-budget:
    # GHA forbids `${{ env.* }}` inside `name:` at the job level (only
    # `github`, `inputs`, `matrix`, `needs`, `strategy`, `vars` are
    # allowed there — see actionlint expression rules). The original
    # PR carried the same bug, which silently disabled the entire
    # workflow file with a 0s "validation failure" run on every push.
    # The real limit lives in .karajan/policy.yml (single source, PL-C)
    # and is extracted fail-loud in the compute step — name is cosmetic.
    name: Net LOC delta within budget
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'large-pr-justified') }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Compute net LOC delta
        id: loc
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Single source of thresholds (PL-C): read the loc-budget max from
          # the policy file — the same number kj review and kj policy check use.
          LOC_LIMIT=$(awk '/id: loc-budget/{f=1} f && /max:/{print $2; exit}' "$KJ_POLICY_FILE")
          case "$LOC_LIMIT" in (''|*[!0-9]*)
            echo "::error::loc-budget max not found in $KJ_POLICY_FILE — the gate refuses to guess"; exit 1;;
          esac
          echo "LOC_LIMIT=$LOC_LIMIT (source: $KJ_POLICY_FILE)"
          # Exportado a los steps posteriores (Enforce) — el env de un run no cruza steps.
          echo "LOC_LIMIT=$LOC_LIMIT" >> "$GITHUB_ENV"

          # KJC-BUG-0519: the delta is counted by kj pr-size, with kj's own budget
          # (src/review/loc-budget.js: lockfiles, generated output and human docs
          # out; AI-rule Markdown such as CLAUDE.md, AGENTS.md and templates/**
          # in), not with a copy of the list here. The counter is the kj of the
          # BASE branch, checked out apart: the PR is only the tree it measures.
          JUDGE="$RUNNER_TEMP/kj-size"
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git worktree add --detach "$JUDGE" "origin/${BASE_REF}"
          (cd "$JUDGE" && npm ci --ignore-scripts --no-audit --no-fund)
          node "$JUDGE/bin/kj.js" pr-size --base "$BASE_REF" --limit "$LOC_LIMIT" --json > "$RUNNER_TEMP/kj-size.json" || true
          net=$(jq -er '.net' "$RUNNER_TEMP/kj-size.json")

          echo "net=$net" >> "$GITHUB_OUTPUT"

          {
            echo "## Shrink Budget — net LOC delta (kj pr-size)"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Lines added | $(jq -r '.added' "$RUNNER_TEMP/kj-size.json") |"
            echo "| In tests | $(jq -r '.testAdded' "$RUNNER_TEMP/kj-size.json") |"
            echo "| Exempt | $(jq -r '.exempt' "$RUNNER_TEMP/kj-size.json") |"
            echo "| **Net delta** | **$net** |"
            echo "| Limit | ${LOC_LIMIT} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce LOC limit
        env:
          NET: ${{ steps.loc.outputs.net }}
        run: |
          set -euo pipefail
          if [ "$NET" -gt "${LOC_LIMIT}" ]; then
            echo "::error::Net LOC delta is $NET, exceeds limit ${LOC_LIMIT}."
            echo ""
            echo "Karajan tracks LOC delta per PR to prevent uncontrolled growth"
            echo "(audit 2026-05-03 found +47% LOC in 4 weeks)."
            echo ""
            echo "Options:"
            echo "  1. Pair the addition with removals so the net stays under ${LOC_LIMIT}."
            echo "  2. If the growth is unavoidable (vendored dep, new pipeline role,"
            echo "     legitimate large feature), apply the 'large-pr-justified' label"
            echo "     to this PR to skip the check."
            exit 1
          fi
          echo "Net LOC delta $NET is within budget (limit ${LOC_LIMIT})."

  new-deps-warning:
    name: New dependencies (advisory)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'new-dep-approved') }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Detect new entries in package.json
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Compare base vs head versions of package.json. Extract dep names
          # from each, then diff to find net additions. We only WARN — this
          # job is intentionally non-blocking; the LOC budget is the gate.
          base_pkg=$(git show "$BASE_SHA":package.json 2>/dev/null || echo '{}')
          head_pkg=$(git show "$HEAD_SHA":package.json 2>/dev/null || echo '{}')

          extract_deps() {
            echo "$1" | jq -r '
              [
                (.dependencies // {} | keys[]),
                (.devDependencies // {} | keys[])
              ] | sort | unique | .[]
            ' 2>/dev/null || true
          }

          base_deps=$(extract_deps "$base_pkg")
          head_deps=$(extract_deps "$head_pkg")

          new_deps=$(comm -13 <(echo "$base_deps") <(echo "$head_deps") || true)

          if [ -z "$new_deps" ]; then
            echo "No new dependencies in this PR."
            echo "## New dependencies — none" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "::warning::This PR introduces new dependencies. Justify in the PR body or apply the 'new-dep-approved' label."
            echo "## New dependencies (advisory)"
            echo ""
            echo "| Dependency |"
            echo "| --- |"
            while IFS= read -r dep; do
              [ -n "$dep" ] && echo "| \`$dep\` |"
            done <<< "$new_deps"
            echo ""
            echo "Each new dep is install cost + supply-chain surface."
            echo "Apply the \`new-dep-approved\` label to silence this warning."
          } | tee -a "$GITHUB_STEP_SUMMARY"
